    *{

    body{

header{

  padding:22px 8%;

  justify-content:space-between;

}

.logo svg{

}

  font-size:1.6rem;
  letter-spacing:3px;
}

nav{
    display:flex;
    gap:30px;
}

nav a{
    text-decoration:none;
    color:var(--forest);
    font-size:0.95rem;
    font-weight:500;
    transition:all 0.3s ease;
    position:relative;
}

nav a:hover{
    color:var(--terracotta);
}

.logo-text{
    font-family:"Cormorant Garamond", serif;
    color:var(--forest);
    font-size:1.6rem;

}

    }
    h1{

        font-size:4rem;
        margin-bottom:40px;
    }
    .intro{
        font-size:1.2rem;
        line-height:1.9;
    }
    .button{
        display:inline-block;
        margin-top:40px;
        padding:14px 28px;
        background:var(--forest);
        color:white;
        text-decoration:none;
        border-radius:40px;
    }
    .button:hover{
        opacity:.9;
    }
    footer{
        background:var(--forest);
        color:white;
        text-align:center;
        padding:50px 20px;
    }
    footer h3{
        font-family:"Cormorant Garamond", serif;
        font-size:2rem;
        margin-bottom:10px;
